version: 2
models:
  - name: daily_order_summary
    description: Daily order volume and completed revenue.
    columns:
      - name: order_date
        data_tests: [unique, not_null]
      - name: total_orders
        data_tests: [not_null]
      - name: completed_orders
        data_tests: [not_null]
      - name: completed_revenue
        data_tests: [not_null]