version: 2
models:
  - name: stg_orders
    description: Cleaned and standardized order records.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: order_date
        data_tests: [not_null]
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [completed, pending, returned, cancelled]
      - name: order_amount
        data_tests: [not_null]